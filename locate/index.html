<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUC Maps - خريطة الكلية الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 32px 24px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 16px;
        }
        h1 { font-size: 26px; margin-bottom: 10px; }
        p { color: #94a3b8; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .btn {
            display: block;
            width: 100%;
            background: #2563eb;
            color: #fff;
            text-decoration: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            transition: background 0.2s;
        }
        .btn:hover { background: #1d4ed8; }
        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #64748b;
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">MUC Indoor Navigation</span>
        <h1>تطبيق MUC Maps</h1>
        <p>حمّل التطبيق عشان تقدر تحدد مكانك جوه مبنى الكلية وتوصل لأي قاعة أو معمل بسهولة.</p>
        
        <a class="btn" href="حط_هنا_رابط_تحميل_الـ_APK_المباشر">
            تحميل التطبيق للأندرويد (APK)
        </a>

        <div class="note">
            💡 بعد تثبيت التطبيق، امسح كود الـ QR مرة تانية وهيفتح مكانك على الخريطة مباشرة.
        </div>
    </div>
</body>
</html>
